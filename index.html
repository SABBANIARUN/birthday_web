<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Rajitha Sister</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
            background: url('https://source.unsplash.com/1600x900/?birthday') no-repeat center center fixed;
            background-size: cover;
            color: white;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .container {
            margin-top: 50px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            display: inline-block;
            width: 90%;
            max-width: 500px;
        }
        h1 {
            font-size: 40px;
            text-shadow: 2px 2px 10px rgba(255, 255, 255, 0.8);
            animation: glow 2s infinite alternate;
        }
        @keyframes glow {
            from {
                text-shadow: 2px 2px 10px rgba(255, 255, 255, 0.8);
            }
            to {
                text-shadow: 5px 5px 20px rgba(255, 255, 255, 1);
            }
        }
        .wish {
            font-size: 20px;
            margin-top: 20px;
            font-weight: bold;
        }
        button {
            background: linear-gradient(to right, #ff0080, #ff8c00);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
            box-shadow: 0px 3px 10px rgba(255, 0, 128, 0.5);
        }
        button:hover {
            background: linear-gradient(to right, #ff8c00, #ff0080);
            transform: scale(1.1);
        }
        .nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            padding: 8px 15px;
            background: #ff0080;
            border-radius: 8px;
            transition: 0.3s;
        }
        .nav a:hover {
            background: #ff8c00;
        }
    </style>
</head>
<body>
    <div class="nav">
        <a href="page1.html">Surprise</a>
        <a href="page2.html">Gallery</a>
        <a href="page3.html">Messages</a>
        <a href="page4.html">Music</a>
    </div>
    <div class="container">
        <h1>🎉 Happy Birthday Rajitha Sister! 🎂</h1>
        <p class="wish">Click the button to receive a special wish!</p>
        <button onclick="showWish()">Get Wish</button>
        <p id="birthdayWish" class="wish"></p>
        <audio id="birthdaySong" src="https://www.myinstants.com/media/sounds/happy-birthday-to-you.mp3" preload="auto"></audio>
        <button onclick="playMusic()">Play Birthday Song</button>
    </div>
    <script>
        function showWish() {
            const wishes = [
                "Happy Birthday Rajitha! May your day be filled with love and joy! 🎈",
                "Rajitha, may your birthday be as wonderful as you are! 🎂",
                "Have a fantastic year ahead, Rajitha! 🎁",
                "May all your dreams come true, dear Rajitha! 🌟",
                "Sending you loads of happiness on your special day, Rajitha! 🎉"
            ];
            const randomWish = wishes[Math.floor(Math.random() * wishes.length)];
            document.getElementById("birthdayWish").textContent = randomWish;
        }
        function playMusic() {
            document.getElementById("birthdaySong").play();
        }
    </script>
</body>
</html>
